# `styles/` holds the packages `vale sync` fetches; it stays out of git.
StylesPath = styles
MinAlertLevel = error
Packages = Google, ai-tells

[*.md]
BasedOnStyles = Vale, Google

Vale.Spelling = NO
Vale.Repetition = NO
Google.Spelling = NO

# The Google style bans a space around the em dash.
Google.EmDash = NO

ai-tells.AbsoluteAssertions = YES
ai-tells.AffirmativeFormulas = YES
ai-tells.AnnouncementHeadings = YES
ai-tells.ClosingPleasantries = YES
ai-tells.ColloquialAssessments = YES
ai-tells.ConclusionMarkers = YES
ai-tells.DefensiveHedges = YES
ai-tells.ExplainerHeadings = YES
ai-tells.ExplainerLeads = YES
ai-tells.FalseExclusivity = YES
ai-tells.FillerPhrases = YES
ai-tells.HedgingPhrases = YES
ai-tells.HollowAcknowledgment = YES
ai-tells.HouseStyle = YES
ai-tells.IncompleteComparison = YES
ai-tells.ListIntroductions = YES
ai-tells.MarketingHeadings = YES
ai-tells.Metacommentary = YES
ai-tells.MicDropHeadings = YES
ai-tells.NarrativePivots = YES
ai-tells.OpeningCliches = YES
ai-tells.PointVerdict = YES
ai-tells.PromotionalPuffery = YES
ai-tells.RestatementMarkers = YES
ai-tells.RhetoricalDevices = YES
ai-tells.SelfReference = YES
ai-tells.ShellNounCopula = YES
ai-tells.StackedHedges = YES
ai-tells.StrategyBuzzwords = YES
ai-tells.StrawmanContrast = YES
ai-tells.StructureAnnouncements = YES
ai-tells.SummativeAppositive = YES
ai-tells.SycophancyMarkers = YES
ai-tells.VagueAttributions = YES
ai-tells.VerbTricolonDensity = YES
ai-tells.WrapUpHeadings = YES
